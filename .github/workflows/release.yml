name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout WuwaAutoMover
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "dmg_name=WuwaAutoMover-${version}.dmg" >> "$GITHUB_OUTPUT"

      - name: Build app
        shell: bash
        run: |
          set -euo pipefail
          WUWA_VERSION="${{ steps.version.outputs.version }}" \
          WUWA_BUILD_NUMBER="${{ github.run_number }}" \
          ./scripts/build_wuwa_auto_mover.sh

      - name: Package DMG
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/create_dmg.sh "${{ steps.version.outputs.version }}"
          dmg_path="build/${{ steps.version.outputs.dmg_name }}"
          echo "dmg_path=${dmg_path}" >> "$GITHUB_OUTPUT"

      - name: Generate signed Sparkle appcast
        id: appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SPARKLE_PRIVATE_KEY}" ]]; then
            echo "Missing SPARKLE_PRIVATE_KEY repository secret." >&2
            exit 1
          fi

          appcast_dir="build/appcast"
          mkdir -p "${appcast_dir}"
          cp "${{ steps.package.outputs.dmg_path }}" "${appcast_dir}/"

          generate_appcast=".build/artifacts/sparkle/Sparkle/bin/generate_appcast"
          if [[ ! -x "${generate_appcast}" ]]; then
            echo "Sparkle generate_appcast tool was not found." >&2
            exit 1
          fi

          printf '%s' "${SPARKLE_PRIVATE_KEY}" | "${generate_appcast}" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}" \
            -o "${appcast_dir}/appcast.xml" \
            "${appcast_dir}"

          echo "appcast_path=${appcast_dir}/appcast.xml" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          dmg_path="${{ steps.package.outputs.dmg_path }}"
          appcast_path="${{ steps.appcast.outputs.appcast_path }}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${dmg_path}" "${appcast_path}" --clobber
          else
            gh release create "${tag}" "${dmg_path}" "${appcast_path}" \
              --title "${tag}" \
              --notes "WuwaAutoMover ${tag}"
          fi
